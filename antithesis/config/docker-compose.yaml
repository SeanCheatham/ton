services:
  validator:
    container_name: ton-validator
    hostname: ton-validator
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: antithesis/Dockerfile
      target: validator
    image: seanton-validator:latest
    environment:
      - VALIDATOR_INDEX=1
      - IS_GENESIS_COORDINATOR=true
      - NUM_VALIDATORS=3
      - VALIDATOR_PORT=30001
      - CONSOLE_PORT=30002
      - LITE_PORT=30003
      - THREADS=2
      - VERBOSITY=3
    volumes:
      - shared:/shared

  validator2:
    container_name: ton-validator2
    hostname: ton-validator2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: antithesis/Dockerfile
      target: validator
    image: seanton-validator:latest
    environment:
      - VALIDATOR_INDEX=2
      - IS_GENESIS_COORDINATOR=false
      - NUM_VALIDATORS=3
      - VALIDATOR_PORT=30001
      - CONSOLE_PORT=30002
      - LITE_PORT=30003
      - THREADS=2
      - VERBOSITY=3
    volumes:
      - shared:/shared

  validator3:
    container_name: ton-validator3
    hostname: ton-validator3
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: antithesis/Dockerfile
      target: validator
    image: seanton-validator:latest
    environment:
      - VALIDATOR_INDEX=3
      - IS_GENESIS_COORDINATOR=false
      - NUM_VALIDATORS=3
      - VALIDATOR_PORT=30001
      - CONSOLE_PORT=30002
      - LITE_PORT=30003
      - THREADS=2
      - VERBOSITY=3
    volumes:
      - shared:/shared

  workload:
    container_name: ton-workload
    hostname: ton-workload
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: antithesis/Dockerfile
      target: workload
    image: seanton-workload:latest
    environment:
      - VALIDATOR_HOST=ton-validator
      - VALIDATOR2_HOST=ton-validator2
      - VALIDATOR3_HOST=ton-validator3
      - VALIDATOR_PORT=30001
      - CONSOLE_PORT=30002
      - LITE_PORT=30003
    volumes:
      - shared:/shared

volumes:
  shared:
